<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино-Трекер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen" x-data="app()" x-init="loadMovies()">

    <!-- Навигация -->
    <nav class="bg-white shadow p-4 mb-6 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">🎬 Кино-Трекер</h1>
            <button @click="showAddModal = true" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-blue-700">+ Фильм</button>
        </div>
    </nav>
    
    <main class="max-w-4xl mx-auto p-4 pb-20">
        <div x-show="loading" class="text-center py-10 text-gray-500">Загрузка...</div>

        <!-- Список: Хочу посмотреть -->
        <section class="mb-10">
            <h2 class="text-2xl font-bold mb-4 text-gray-700">📌 Хочу посмотреть (<span x-text="wishlist.length"></span>)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="movie in wishlist" :key="movie.id">
                    <div class="bg-white p-4 rounded-lg shadow flex gap-4">
                        <img :src="movie.poster_url || 'https://via.placeholder.com/100x150?text=No+Image'" class="w-20 h-30 object-cover rounded bg-gray-200">
                        <div class="flex-1 flex flex-col">
                            <h3 class="font-bold text-lg" x-text="movie.title"></h3>
                            <p class="text-sm text-gray-500" x-text="`${movie.director || ''} ${movie.year || ''}`.trim()"></p>
                            <div class="mt-auto pt-2 flex gap-3">
                                <a :href="`review.html?id=${movie.id}`" class="text-blue-600 font-semibold hover:underline">Написать отчет →</a>
                                <button @click="deleteMovie(movie.id)" class="text-red-500 text-sm hover:underline ml-auto">Удалить</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Список: Посмотрено -->
        <section>
            <h2 class="text-2xl font-bold mb-4 text-gray-700">✅ Посмотрено (<span x-text="watched.length"></span>)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="movie in watched" :key="movie.id">
                    <div class="bg-white p-4 rounded-lg shadow flex gap-4">
                        <img :src="movie.poster_url || 'https://via.placeholder.com/100x150?text=No+Image'" class="w-20 h-30 object-cover rounded bg-gray-200">
                        <div class="flex-1 flex flex-col">
                            <h3 class="font-bold text-lg" x-text="movie.title"></h3>
                            <p class="text-sm text-gray-500" x-text="`${movie.director || ''} ${movie.year || ''}`.trim()"></p>
                            <p x-show="movie.review" class="text-yellow-500 font-bold mt-1">
                                ★ <span x-text="movie.review.rating"></span>/10
                            </p>
                            <div class="mt-auto pt-2 flex gap-3">
                                <a :href="`review.html?id=${movie.id}`" class="text-blue-600 font-semibold hover:underline">Отчет →</a>
                                <button @click="deleteMovie(movie.id)" class="text-red-500 text-sm hover:underline ml-auto">Удалить</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </main>

    <!-- Модалка добавления -->
    <div x-show="showAddModal" x-cloak class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Добавить фильм</h3>
            <form @submit.prevent="addMovie">
                <input type="text" x-model="newMovie.title" placeholder="Название *" required class="w-full p-2 border rounded mb-3">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="text" x-model="newMovie.director" placeholder="Режиссер" class="p-2 border rounded">
                    <input type="number" x-model="newMovie.year" placeholder="Год" class="p-2 border rounded">
                </div>
                <input type="text" x-model="newMovie.country" placeholder="Страна" class="w-full p-2 border rounded mb-3">
                <input type="text" x-model="newMovie.poster_url" placeholder="Ссылка на постер (URL)" class="w-full p-2 border rounded mb-4">
                <div class="flex gap-3">
                    <button type="button" @click="showAddModal = false" class="flex-1 bg-gray-200 py-2 rounded font-bold">Отмена</button>
                    <button type="submit" class="flex-1 bg-green-600 text-white py-2 rounded font-bold">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- НАСТРОЙКИ SUPABASE ---
        const SUPABASE_URL = 'ВСТАВЬ_СЮДА_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'ВСТАВЬ_СЮДА_ANON_KEY';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function app() {
            return {
                loading: true,
                showAddModal: false,
                wishlist: [],
                watched: [],
                newMovie: { title: '', director: '', year: '', country: '', poster_url: '' },

                async loadMovies() {
                    this.loading = true;
                    // Получаем фильмы
                    const { data: movies } = await sb.from('movies').select('*').order('created_at', { ascending: false });
                    // Получаем отзывы
                    const { data: reviews } = await sb.from('reviews').select('*');
                    
                    // Мерджим отзывы к фильмам для быстрого доступа
                    const reviewsMap = {};
                    reviews.forEach(r => reviewsMap[r.movie_id] = r);
                    
                    const allMovies = movies.map(m => ({ ...m, review: reviewsMap[m.id] || null }));
                    
                    this.wishlist = allMovies.filter(m => m.status === 'wishlist');
                    this.watched = allMovies.filter(m => m.status === 'watched');
                    this.loading = false;
                },

                async addMovie() {
                    if (!this.newMovie.title) return;
                    await sb.from('movies').insert({ ...this.newMovie, status: 'wishlist' });
                    this.newMovie = { title: '', director: '', year: '', country: '', poster_url: '' };
                    this.showAddModal = false;
                    this.loadMovies();
                },

                async deleteMovie(id) {
                    if (confirm('Удалить фильм и его отчет?')) {
                        await sb.from('movies').delete().eq('id', id);
                        this.loadMovies();
                    }
                }
            }
        }
    </script>
</body>
</html>
